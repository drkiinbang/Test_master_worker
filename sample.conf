# Remote Worker Configuration File
# Format: ip_address,username,worker_path,ssh_port

# descriptions:
# ip_address: IP address of the remote machine where the worker should be launched
# username: SSH username used to log into the remote machine
# worker_path: Full path to the worker executable on the remote machine
# ssh_port: (Optional) SSH port number; defaults to 22 if omitted

# 예제 1: Linux 워커
192.168.1.101,ubuntu,/home/ubuntu/point_cloud_worker,22

# 예제 2: Windows 워커 (역슬래시는 두 번 써야 함)
192.168.1.102,Administrator,C:\\Workers\\point_cloud_worker.exe,22

# 예제 3: 포트가 다를 경우 명시 가능
10.0.0.50,admin,/opt/workers/worker_executable,2222