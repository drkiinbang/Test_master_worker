# Remote Worker Configuration File
# Lines with commas are remote workers: ip,username,worker_path,ssh_port
# Lines with key=value are settings.

# ===== Settings (defaults) =====
drain_seconds=5
worker_idle_timeout_seconds=20
worker_retry_max=5
worker_retry_backoff_ms=200
worker_recv_timeout_ms=5000
worker_send_timeout_ms=5000
ssh_connect_timeout_sec=5
ssh_server_alive_interval_sec=5
ssh_server_alive_count_max=2
ssh_batch_mode=yes
ssh_strict_host_key=accept-new

run_local_worker_on_master=true

# No response from workers longer than this time, master try local worker spawn
master_starvation_seconds=60
# Max spawn try
emergency_local_spawn_max=3

# [각 항목 설명]
# drain_seconds=5（Master）: 
###                     모든 청크 결과를 다 받은 직후에도 drain_seconds 동안 accept()를 계속 열어둡니다. 그 사이 새로 붙는 워커에게는 **즉시 TERMINATE**를 보내 깨끗이 내려가도록 하기 위함입니다. 너무 짧으면 늦게 뜬 워커가 TERMINATE를 못 받습니다.
# worker_idle_timeout_seconds=20（Worker）: 
###                     마지막 “정상 작업 1건 완료” 이후, 일/응답이 없는 상태로 버틸 최대 시간입니다. 이 시간이 지나면 워커는 “더 이상 일이 없거나 응답 없음”으로 자가 종료합니다. retry_max와 별개로, 둘 중 먼저 도달하는 조건이 종료를 트리거합니다.
# worker_retry_max=5（Worker）: 
###                     연결 실패·수신 실패 등 연속 실패 허용 횟수입니다. 이 횟수에 도달하면 자가 종료합니다. (성공 1번이면 실패 카운터는 0으로 리셋)
# worker_retry_backoff_ms=200（Worker）: 
###                     실패 시 재시도까지의 백오프 기본 시간(ms). 코드상 백오프는 선형(base * 실패횟수)입니다. 예: base=200, retry_max=5면 대기는 200→400→600→800→1000ms (누적 3.0초) + 각 시도에서의 소켓 타임아웃/연결시간이 추가됩니다.
# worker_recv_timeout_ms=5000（Worker）: 
###                     수신(Recv) 타임아웃(ms). 길이 프레이밍 첫 4바이트 받기 포함 전체 recv에 적용됩니다. 마스터가 느리거나 끊겼을 때 워커가 무한 대기하지 않도록 합니다.
# worker_send_timeout_ms=5000（Worker）: 
###                     송신(Send) 타임아웃(ms). 결과 전송이 네트워크 이슈로 막힐 때 무한 블록 방지용입니다.
# ssh_connect_timeout_sec=5（SSH 실행）: 
###                     원격 워커 띄울 때 ssh의 초기 접속 타임아웃(초). 접속이 지연되면 빨리 실패시켜 원격 실행 스레드가 정상적으로 종료될 수 있게 합니다.
# ssh_server_alive_interval_sec=5（SSH 실행）: 
###                     ssh가 서버에 보내는 keepalive 주기(초). 연결이 죽었는데 커널이 모르는 “좀비 세션”을 빨리 감지합니다.
# ssh_server_alive_count_max=2（SSH 실행）: 
###                     keepalive 응답이 몇 번 연속으로 없을 때 ssh를 종료할지 결정합니다. 위 예시면 5초 간격 × 2회 미응답 → 종료(대략 10초 내 정리).
# ssh_batch_mode=yes（SSH 실행）: 
###                     비대화식 모드. 비밀번호/키프레이즈/호스트키 확인 등 프롬프트가 필요하면 즉시 실패합니다. 원격 실행 스레드가 join()에서 걸리지 않게 하는 핵심 옵션입니다.
# ssh_strict_host_key=accept-new（SSH 실행）: 
###                     처음 접속하는 호스트키를 자동으로 신뢰하고 등록합니다. 편하지만 보안적으로는 운영 정책을 고려해야 합니다. 대안: yes(엄격: 기존 키와 불일치 시만 경고; 첫 연결은 수동 승인 필요), no(검증 안 함—권장하지 않음).

